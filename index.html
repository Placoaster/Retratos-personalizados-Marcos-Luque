<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcos Luque - Retratos a Encargo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        :root {
            --color-principal: #111111;
            --color-secundario: #555555;
            --color-fondo: #fcfcfc;
            --color-blanco: #ffffff;
            --fuente-canva: "Canva Sans", "Montserrat", -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--fuente-canva);
        }

        body {
            background-color: var(--color-fondo);
            color: var(--color-principal);
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .contenedor-web {
            width: 100%;
            max-width: 650px;
            background: var(--color-blanco);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        /* Visor para tu PDF literal */
        .visor-pdf {
            width: 100%;
            height: 750px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 40px;
        }

        /* Formulario inferior estilo Canva */
        .formulario-pedido {
            border-top: 2px solid #f0f0f0;
            padding-top: 30px;
        }

        .formulario-pedido h3 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .grupo-campo {
            margin-bottom: 20px;
        }

        .grupo-campo label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .grupo-campo input[type="text"],
        .grupo-campo input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .grupo-campo input:focus {
            outline: none;
            border-color: var(--color-principal);
        }

        /* Zona de arrastrar foto */
        .zona-upload {
            position: relative;
            border: 2px dashed #cccccc;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .zona-upload:hover {
            background: #f2f2f2;
            border-color: var(--color-principal);
        }

        .zona-upload input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .zona-upload p {
            font-size: 0.95rem;
            color: var(--color-secundario);
        }

        /* Botones estilo Canva */
        .btn-bloque {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-bloque:active {
            transform: scale(0.99);
        }

        .btn-negro {
            background-color: var(--color-principal);
            color: var(--color-blanco);
            margin-top: 10px;
        }

        .btn-negro:hover {
            background-color: #333333;
        }

        .btn-linea {
            background-color: transparent;
            color: var(--color-secundario);
            border: 1.5px solid #cccccc;
            margin-top: 15px;
        }

        .btn-linea:hover {
            background-color: #f5f5f5;
            color: var(--color-principal);
            border-color: var(--color-principal);
        }

        @media (max-width: 600px) {
            body { padding: 10px 5px; }
            .contenedor-web { padding: 20px 15px; }
            .visor-pdf { height: 450px; }
        }
    </style>
</head>
<body>

    <div class="contenedor-web">

        <iframe class="visor-pdf" src="Personalizados en 24h.pdf" type="application/pdf">
            <p>Tu navegador no puede mostrar el PDF directamente. <a href="Personalizados en 24h.pdf">Haz clic aquí para ver el catálogo.</a></p>
        </iframe>

        <div class="formulario-pedido">
            <h3>Realizar Pedido</h3>
            
            <form action="https://formsubmit.co/marluji2009@gmail.com" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" name="_subject" value="Nuevo Retrato Solicitado - 24h">
                <input type="hidden" name="_next" value="https://placoaster.github.io/">

                <div class="grupo-campo">
                    <label for="name">Tu Nombre</label>
                    <input type="text" id="name" name="name" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="grupo-campo">
                    <label for="email">Tu Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="Ej. juan@correo.com">
                </div>

                <div class="grupo-campo">
                    <label>Sube la foto para tu retrato</label>
                    <div class="zona-upload">
                        <p>Haz clic aquí o arrastra tu foto</p>
                        <input type="file" name="attachment" accept="image/*" required>
                    </div>
                </div>

                <button type="submit" class="btn-bloque btn-negro">Enviar fotos y hacer pedido</button>
            </form>

            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=marluji2009@gmail.com&su=Consulta sobre Retratos Personalizados" target="_blank" class="btn-bloque btn-linea">
                Contacta conmigo
            </a>
        </div>

    </div>

</body>
</html>
